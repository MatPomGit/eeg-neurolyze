site_name: EEG Neurolyze
site_description: Documentation of EEG acquisition, analysis, EEG-BIDS and reproducible research
site_url: https://matpomgit.github.io/eeg-neurolyze/
repo_url: https://github.com/MatPomGit/eeg-neurolyze
repo_name: MatPomGit/eeg-neurolyze
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: pl
  logo: assets/neurolyze-mark.svg
  favicon: assets/neurolyze-mark.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Tryb ciemny
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Tryb jasny

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start: index.md
  - Polski:
      - Przegląd: pl/index.md
      - Pierwsze uruchomienie: pl/quickstart.md
      - Architektura przetwarzania: pl/workflow.md
      - Referencja CLI: pl/cli.md
      - Syntetyczne EEG i BIDS: pl/bids.md
      - Rzeczywiste EEG - PhysioNet i własny zapis: pl/real-eeg.md
      - Muse S Athena (rozwój): pl/muse-athena.md
      - Walidacja i reprodukowalność: pl/quality.md
      - Prezentacja EEG-BIDS: pl/presentation.md
      - Rozwój dokumentacji: pl/documentation.md
  - English:
      - Overview: en/index.md
      - Quick start: en/quickstart.md
      - Processing architecture: en/workflow.md
      - CLI reference: en/cli.md
      - Synthetic EEG and BIDS: en/bids.md
      - Real EEG - PhysioNet and local: en/real-eeg.md
      - Muse S Athena (development): en/muse-athena.md
      - Quality and reproducibility: en/quality.md
      - EEG-BIDS presentation: en/presentation.md
  - Projekt badawczy:
      - Koncepcja i architektura: architecture/PROJECT-CONCEPT.md
      - Kamienie milowe: architecture/ROADMAP.md
      - Decyzje ADR: architecture/adr/README.md
      - Dziennik badań: research/index.md
